flex;align-items:center;gap:10px}.levels{display:flex;gap:0}.level-dot{width:25px;height:36px;display:grid;place-items:center}.level-dot:before{content:'';height:5px;width:5px;background:#d3d7c9;border-radius:50%;transition:.2s}.level-dot.active:before{background:var(--green);width:18px;border-radius:4px}.level-dot.done:before{background:#9aaa8b}.level-dot.active.done:before{background:var(--green)}.hint-btn{width:34px;height:36px;display:grid;place-items:center;border-left:1px solid #e0e3d6;padding-left:10px}.hint-btn svg{width:18px;height:18px;color:#8b967e}.hint-btn.on svg{color:var(--accent)}.playfield{flex:1;min-height:0;position:relative;isolation:isolate;overflow:hidden;background:#e8e1d0}#game{display:block;width:100%;height:100%;touch-action:none;outline:none}.skip{position:absolute;right:14px;top:8px;font-size:10px;min-height:36px;color:#8a8271;padding:0 12px;background:#fcf9edc9;border-radius:20px}.skip[hidden]{display:none}.bottom{flex:0 0 auto;background:var(--paper);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px #c6c6ad44;z-index:3}.context{height:40px;display:flex;align-items:center;justify-content:center;position:relative;margin:0 16px}.status{font-size:11px;color:#8f967f;letter-spacing:-.1px;text-align:center;line-height:1.3}.toast{position:absolute;left:50%;bottom:calc(57px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:#3a5146ee;color:#fffcf4;font-size:11px;padding:10px 16px;border-radius:20px;box-shadow:0 5px 15px #35483f15;opacity:0;pointer-events:none;white-space:nowrap;transition:.2s;z-index:9;max-width:94%}.toast.show{opacity:1;transform:translate(-50%,0)}.success{position:absolute;inset:0;z-index:6;display:flex;justify-content:center;align-items:end;padding:24px 22px;background:linear-gradient(transparent 20%,#eceee17a);animation:appear .35s ease}.success[hidden],.sheet[hidden]{display:none}.success-card{border:1px solid #fafff2;background:#fffdf3f5;box-shadow:0 10px 40px #344c3926;border-radius:20px;padding:23px;width:100%;max-width:330px;text-align:center;backdrop-filter:blur(10px)}.success-card .check{margin:0 auto 12px;display:grid;place-items:center;background:#e7edde;color:#67815a;width:38px;height:38px;border-radius:50%}.check svg{width:20px;height:20px}.success-card h1{font-size:27px;font-weight:700;letter-spacing:-1.4px;margin:0 0 5px}.success-card p{font-size:11px;color:#9aa18a;margin:0 0 19px}.primary{height:47px;width:100%;border-radius:10px;background:var(--green);color:#fffdf1;display:flex;justify-content:center;align-items:center;gap:17px;font-size:12px}.primary svg{width:16px;height:16px}.sheet{position:absolute;inset:0;background:#293d3566;backdrop-filter:blur(4px);display:flex;align-items:end;z-index:20}.sheet-card{width:100%;padding:10px 26px calc(27px + env(safe-area-inset-bottom));background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -15px 60px #253a351a;animation:appear .2s}.sheet-handle{width:32px;height:4px;background:#d6dbcb;border-radius:10px;margin:2px auto 23px}.sheet-card h2{font-size:21px;letter-spacing:-1px;margin:0 0 24px}.help-step{display:flex;align-items:center;gap:17px;margin:21px 0}.help-step>span{display:grid;place-items:center;height:39px;width:39px;border-radius:11px;background:#e7ebdd;color:#768a68;flex-shrink:0}.help-step svg{width:21px;height:21px}.help-step b{font-size:13px;font-weight:500;display:block;margin-bottom:4px}.help-step p{font-size:11px;color:#999f8c;margin:0;line-height:1.6}.sheet-options{margin:26px 0 19px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px}.sound-control{height:36px;font-size:11px;display:flex;gap:8px;align-items:center;color:#89957c}.sound-control svg{width:17px;height:17px}.restart-control{height:36px;font-size:11px;color:#a57d65}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(min-width:600px){body{display:grid;place-items:center;background:radial-gradient(ellipse at 30% 20%,#edf0e5,#d9dfd0)}.app{height:min(920px,calc(100dvh - 40px));border-radius:26px;box-shadow:0 16px 70px #3d51491a,0 0 0 1px #c6cebc77}.topbar{padding-top:8px}}@media(max-height:690px){.topbar{min-height:51px;padding-top:4px}.levelbar{flex-basis:36px}.context{height:34px}.toast{bottom:calc(50px + env(safe-area-inset-bottom))}.success-card{padding:19px}.success-card h1{font-size:24px}}
.pen-toggle{position:absolute;right:12px;bottom:12px;width:25%;height:auto;aspect-ratio:1;z-index:5;border-radius:50%;display:grid;place-items:center;background:#fffaf0;color:#a9765b;border:1px solid #d9c8ab;box-shadow:0 3px 12px #60492b22;transition:background .15s,color .15s,box-shadow .15s}.pen-toggle svg{width:44%;height:44%}.pen-toggle.on{background:#b96d51;color:#fff9ec;border-color:#a75e45;box-shadow:0 0 0 4px #bf785c22,0 3px 12px #60492b22}.pen-toggle.on:after{content:'';position:absolute;right:8%;top:8%;width:8%;height:8%;background:#fff7d4;border-radius:50%}.pen-toggle[hidden]{display:none}

<div class="app">

<main class="playfield" id="playfield"><canvas id="game" tabindex="0" aria-label="위쪽은 벽과 깔린 타일 사이의 빈자리, 아래쪽은 재단할 타일입니다. 타일과 자를 직접 끌고, 오른쪽 아래 펜을 켠 뒤 타일 위에 그리세요. 닫힌 조각 위에 올리면 제거 영역을 보여줍니다."></canvas><button class="pen-toggle" id="pen-toggle" aria-label="펜 켜기" aria-pressed="false" title="펜 켜기"><svg fill="none" stroke="currentColor" stroke-width="1.6"><use href="#i-pen"/></svg></button><button class="skip" id="skip">건너뛰기</button><div class="success" id="success" hidden><div class="success-card"><div class="check"><svg fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-check"/></svg></div><h1>딱 맞았다!</h1><p id="success-detail">마지막 한 장, 완성.</p><button class="primary" id="next">다음 타일 <svg fill="none" stroke="currentColor" stroke-width="1.6"><use href="#i-arrow"/></svg></button></div></div></main>
<footer class="bottom"><div class="context"><span class="status" id="status" role="status">타일·자는 드래그 · 펜은 오른쪽 아래</span></div></footer>

<script src="tile-engine.js"></script>
<script>
/* Mobile gameplay POC. No external packages, remote assets or persisted state. */
'use strict';
const N=TileEngine.N, W=420;
let H=640, S=210, sceneBottom=300;
const stages=Object.create(null);
let layoutBlocked=false, layoutCertificate=null, seedCounter=0;
function nextSeed(){
 const bytes=new Uint32Array(1);
 if(globalThis.crypto?.getRandomValues){globalThis.crypto.getRandomValues(bytes);return bytes[0]}
 return (Date.now()+Math.imul(++seedCounter,0x9e3779b9))>>>0;
}
function requestedSeed(){
 const value=typeof URLSearchParams==='function'?new URLSearchParams(window.location?.search||'').get('seed'):null;
 return value!==null&&/^\d+$/.test(value)&&Number(value)<=0xffffffff?Number(value):undefined;
}

const Geometry={
 inside(x,y,poly){let v=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])v=!v}return v},
 target(poly){let m=new Uint8Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)m[y*N+x]=this.inside((x+.5)/N,(y+.5)/N,poly)?1:0;return m},
 regions(solid,lines){return TileEngine.regions(solid,lines)},
 score(solid,target){let intersection=0,union=0,area=0;for(let i=0;i<solid.length;i++){if(solid[i]&&target[i])intersection++;if(solid[i]||target[i])union++;area+=solid[i]}return{fit:union?intersection/union:0,area:area/(N*N)}},
 clip(a,b,minLength=3){let dx=b.x-a.x,dy=b.y-a.y,t0=0,t1=1;for(let [p,q] of [[-dx,a.x],[dx,N-1-a.x],[-dy,a.y],[dy,N-1-a.y]]){if(Math.abs(p)<1e-8){if(q<0)return null}else{let r=q/p;if(p<0)t0=Math.max(t0,r);else t1=Math.min(t1,r);if(t0>t1)return null}}if(Math.hypot(dx*(t1-t0),dy*(t1-t0))<minLength)return null;return[a.x+dx*t0,a.y+dy*t0,a.x+dx*t1,a.y+dy*t1]}
};
const $=s=>document.querySelector(s), canvas=$('#game'), ctx=canvas.getContext('2d');
let targetPos={x:93,y:44}, home={x:105,y:375}, tile={...home};
let stage=0, solid, lines=[], seg, targetMask;
let tiles=[], activeTileId=0;
let phase='intro', cuts=0, removed=0, history=[], hint=false;
let ruler={x:210,y:590,angle:0}, penMode=false;
let triangle={x:346,y:310,angle:0}, lastTool='ruler';
let drag=null, stroke=null, hover=-1, pointer={x:-100,y:-100};
let pointers=new Map(), gesture=null, particles=[];
let materialEdges=[], traceEdges=[], materialRects=[], materialBounds={left:0,top:0,right:1,bottom:1}, roomRefs=[], wallRects=[];
let snapGuides=[], snapUntil=0, snapKey='', previewMask=null, previewOutline=[], previewTileId=null;
const previewCanvas=document.createElement('canvas'), previewCtx=previewCanvas.getContext('2d');previewCanvas.width=previewCanvas.height=N;
let introStart=0, introContact=null, animationStart=0, animationFrom=null, fit=0, toastTimer;
let sound=true, audio=null, lastTime=0, ready=false, backdropDirty=true;
let tileCanvas=document.createElement('canvas'), tctx=tileCanvas.getContext('2d');
let maskCanvas=document.createElement('canvas'), mctx=maskCanvas.getContext('2d');
const texture=document.createElement('canvas'), plaster=document.createElement('canvas');
const backdrop=document.createElement('canvas'), bg=backdrop.getContext('2d');
for(const c of [tileCanvas,maskCanvas,texture,plaster]){c.width=N;c.height=N}
function random(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function makeTextures(){
 const r=random(713), g=texture.getContext('2d');
 g.fillStyle='#a6b8aa';g.fillRect(0,0,N,N);
 const colors=['#e9e7ce','#718e7c','#d6c5a0','#dce2cd','#819c88','#f0eddb'];
 for(let i=0;i<560;i++){let x=r()*N,y=r()*N,s=.8+r()*3.5;g.fillStyle=colors[(r()*colors.length)|0];g.beginPath();g.moveTo(x,y);g.lineTo(x+s*(.5+r()),y+s*.2);g.lineTo(x+s*.8,y+s*(.8+r()));g.lineTo(x-s*.4,y+s*.5);g.closePath();g.fill()}
 let gradient=g.createLinearGradient(0,0,N,N);gradient.addColorStop(0,'#ffffff14');gradient.addColorStop(1,'#395c4309');g.fillStyle=gradient;g.fillRect(0,0,N,N);
 const p=plaster.getContext('2d');p.fillStyle='#d9c9b8';p.fillRect(0,0,N,N);
 for(let i=0;i<16000;i++){p.fillStyle=r()>.5?'#aa8f7310':'#fff9eb26';p.fillRect(r()*N,r()*N,.6+r(),.6+r())}
}
makeTextures();
function poly(g,points,x=0,y=0,size=1){g.beginPath();points.forEach((p,i)=>i?g.lineTo(x+p[0]*size,y+p[1]*size):g.moveTo(x+p[0]*size,y+p[1]*size));g.closePath()}
function label(g,s,x,y,size=10,color='#8e957e',align='left',weight='400'){
 g.font=`${weight} ${size}px "Avenir Next", "Apple SD Gothic Neo", sans-serif`;g.fillStyle=color;g.textAlign=align;g.fillText(s,x,y);g.textAlign='left';
}
function wallPolys(){
 const p=stages[stage];if(!p)return[];
 const front=p.path.slice(0,-2).map(([x,y])=>[targetPos.x+x*S,targetPos.y+y*S]);
 return[[[0,0],[W,0],[W,front[front.length-1][1]],...front.slice().reverse(),[0,front[0][1]]]];
}

function paintBackdrop(){
 const scale=2;backdrop.width=W*scale;backdrop.height=Math.ceil(H*scale);bg.setTransform(scale,0,0,scale,0,0);
 // A real floor: matching full tiles, one missing cell, and solid walls.
 bg.fillStyle='#d9ddcc';bg.fillRect(0,0,W,sceneBottom);
 bg.save();bg.beginPath();bg.rect(0,0,W,sceneBottom);bg.clip();
 for(let row=-1;row<4;row++)for(let col=-2;col<3;col++){
  let x=targetPos.x+col*S,y=targetPos.y+row*S;
  if(row===0&&col===0)continue;
  bg.drawImage(texture,x+1.5,y+1.5,S-3,S-3);
  bg.fillStyle=(row+col)%2?'#fffcee0a':'#47665206';bg.fillRect(x+1.5,y+1.5,S-3,S-3);
  bg.strokeStyle='#f4f4dc77';bg.lineWidth=1;bg.strokeRect(x+2,y+2,S-4,S-4);
  bg.strokeStyle='#6c846050';bg.beginPath();bg.moveTo(x+S-2,y+2);bg.lineTo(x+S-2,y+S-2);bg.lineTo(x+2,y+S-2);bg.stroke();
 }
 // Exposed ridged tile adhesive only in the last tile's footprint.
 poly(bg,stages[stage].path,targetPos.x,targetPos.y,S);bg.save();bg.clip();
 bg.fillStyle='#a3a696';bg.fillRect(targetPos.x,targetPos.y,S,S);
 bg.lineWidth=3;bg.strokeStyle='#89917c77';
 for(let k=-S;k<S*2;k+=7){bg.beginPath();bg.moveTo(targetPos.x+k,targetPos.y);bg.lineTo(targetPos.x+k-S*.25,targetPos.y+S);bg.stroke()}
 bg.lineWidth=1;bg.strokeStyle='#c9cbb655';
 for(let k=-S;k<S*2;k+=7){bg.beginPath();bg.moveTo(targetPos.x+k+2,targetPos.y);bg.lineTo(targetPos.x+k-S*.25+2,targetPos.y+S);bg.stroke()}
 bg.restore();
 // Walls cover the cuts' negative space and continue outside the missing cell.
 for(const wall of wallPolys()){
  bg.save();bg.translate(0,7);poly(bg,wall);bg.shadowColor='#4d5d4055';bg.shadowBlur=9;bg.shadowOffsetY=3;bg.fillStyle='#ab9982';bg.fill();bg.restore();
  poly(bg,wall);bg.save();bg.clip();bg.fillStyle=bg.createPattern(plaster,'repeat');bg.fillRect(0,0,W,sceneBottom);
  let light=bg.createLinearGradient(0,0,W,sceneBottom);light.addColorStop(0,'#fffcf31a');light.addColorStop(1,'#a2856e10');bg.fillStyle=light;bg.fillRect(0,0,W,sceneBottom);bg.restore();
  poly(bg,wall);bg.strokeStyle='#f6e6d2aa';bg.lineWidth=1.2;bg.stroke();
 }
 label(bg,'벽',24,26,9,'#aa9680');
 bg.restore();
 // Warm plywood below the floor, with a physical front edge.
 const r=random(221);bg.fillStyle='#e8dfcd';bg.fillRect(0,sceneBottom,W,H-sceneBottom);
 for(let i=0;i<155;i++){

  for(let d=12;d<length-12;d+=5){const major=(d-12)%20===0,k=major?9:5,x=a[0]+c*d,y=a[1]+s*d;
   ctx.strokeStyle='#527b7888';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x-s*3,y+c*3);ctx.lineTo(x-s*(k+3),y+c*(k+3));ctx.stroke();
  }
 }
 ctx.strokeStyle='#59837f';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-l+10,l-23);ctx.lineTo(-l+23,l-23);ctx.lineTo(-l+23,l-10);ctx.stroke();
 for(const[x,y]of vertices.slice(1)){ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fillStyle='#e9faf1';ctx.fill();ctx.strokeStyle='#78a5a0';ctx.stroke();ctx.beginPath();ctx.arc(x,y,3,0,6);ctx.stroke()}
 ctx.restore();
}
function drawRuler(){
 if(phase==='success')return;
 let len=rulerLength(),end=len/2-17;
 ctx.save();ctx.translate(ruler.x,ruler.y);ctx.rotate(ruler.angle);
 ctx.shadowColor='#705f3c30';ctx.shadowBlur=7;ctx.shadowOffsetY=4;
 ctx.beginPath();ctx.roundRect(-len/2,-16,len,32,4);ctx.fillStyle='#e3be77e6';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#b3925d88';ctx.lineWidth=.8;ctx.stroke();
 ctx.fillStyle='#fff3c5cc';ctx.fillRect(-len/2+2,-16,len-4,2.5);
 for(let x=-Math.floor((len/2-32)/5)*5;x<=len/2-30;x+=5){let major=x%20===0;ctx.strokeStyle=major?'#8d744bbb':'#a3885977';ctx.beginPath();ctx.moveTo(x,-13);ctx.lineTo(x,major?-4:-8);ctx.stroke();if(major)label(ctx,String(Math.round((x+140)/20)),x,5,6.5,'#9b8153','center')}
 label(ctx,`${((Math.round(ruler.angle*180/Math.PI)%180)+180)%180}°`,0,12,6.5,'#8e754c','center');
 for(let x of [-end,end]){
  if(drag?.type==='ruler'||drag?.type==='rotate'||handleHit(pointer)){ctx.beginPath();ctx.arc(x,0,17,0,7);ctx.fillStyle='#fff7da44';ctx.fill()}
  ctx.beginPath();ctx.arc(x,0,8.5,0,7);ctx.fillStyle='#fff4d4';ctx.fill();ctx.strokeStyle='#b99b66';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='#a58d5d';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(x,0,3.7,-2.5,2.2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-1,4.5);ctx.lineTo(x-3.3,2.2);ctx.lineTo(x-.3,1.3);ctx.stroke();
 }
 // A freehand stroke intentionally has no guide.
 if(stroke?.guide?.kind==='ruler'||snapKey.startsWith('ruler:')){ctx.strokeStyle='#fffad5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-len/2+3,-16);ctx.lineTo(len/2-3,-16);ctx.stroke()}
 ctx.restore();
}
function drawStroke(){
 if(!stroke)return;ctx.save();
 if(stroke.guide){ctx.strokeStyle='#fff9d7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(stroke.guide.a.x,stroke.guide.a.y);ctx.lineTo(stroke.guide.b.x,stroke.guide.b.y);ctx.stroke()}
 ctx.strokeStyle='#9c5745dd';ctx.lineWidth=1.7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 stroke.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
}
function drawSnapGuides(now){
 if(!snapGuides.length||phase!=='play')return;
 if(!drag&&now>snapUntil){clearSnap();return}
 ctx.save();ctx.globalAlpha=drag?1:Math.max(0,(snapUntil-now)/650);ctx.strokeStyle='#537d67';ctx.fillStyle='#eff5de';ctx.lineWidth=1.5;
 for(const ref of snapGuides){ctx.beginPath();ctx.moveTo(ref.a.x,ref.a.y);ctx.lineTo(ref.b.x,ref.b.y);ctx.stroke();for(const p of[ref.a,ref.b]){ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,7);ctx.fill();ctx.stroke()}}
 ctx.restore();
}
function drawMagnifier(){
 if(!drag||!['pen','ruler','rotate','triangle','triangle-rotate'].includes(drag.type))return;
 const focus=stroke?stroke.tip:drag.type==='pen'?pointer:drag.type.includes('rotate')?pointer:drag.type==='triangle'?pointer:edgePoint(pointer);
 let x=Math.max(50,Math.min(W-50,focus.x)),y=focus.y-82;if(y<51)y=focus.y+83;if(y>H-50)y=H-50;
 ctx.save();ctx.beginPath();ctx.arc(x,y,38,0,7);ctx.shadowColor='#52604733';ctx.shadowBlur=12;ctx.fillStyle='#fdf9e9';ctx.fill();ctx.shadowColor='transparent';ctx.clip();
 // Use a pre-rendered scene and tile; never sample the magnifier itself.
 ctx.translate(x,y);ctx.scale(1.9,1.9);ctx.translate(-focus.x,-focus.y);
 ctx.drawImage(backdrop,0,0,W,H);for(const t of tiles)ctx.drawImage(t.canvas,t.pos.x,t.pos.y,S,S);
 if(hint){ctx.strokeStyle='#fff8d6';ctx.lineWidth=.8;ctx.setLineDash([2,3]);for(const[a,b]of stages[stage].hints){ctx.beginPath();ctx.moveTo(tile.x+a[0]*S,tile.y+a[1]*S);ctx.lineTo(tile.x+b[0]*S,tile.y+b[1]*S);ctx.stroke()}ctx.setLineDash([])}
 if(stroke)drawStroke();else{const guide=lastTool==='triangle'?triangleEdges().reduce((a,b)=>projectGuide(focus,a).distance<projectGuide(focus,b).distance?a:b):rulerEdge();ctx.strokeStyle='#c1944c';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(guide.a.x,guide.a.y);ctx.lineTo(guide.b.x,guide.b.y);ctx.stroke()}ctx.restore();
 ctx.save();ctx.beginPath();ctx.arc(x,y,38,0,7);ctx.strokeStyle='#fffcf0';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#bf785b';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke();ctx.restore();
}
function drawTargetGuide(){
 if(phase==='intro'||phase==='success')return;
 const near=Math.hypot(tile.x-targetPos.x,tile.y-targetPos.y)<60;
 ctx.save();poly(ctx,stages[stage].path,targetPos.x+1,targetPos.y+1,S-2);ctx.setLineDash([4,5]);ctx.strokeStyle=near?'#fff4cf':'#e5e9c488';ctx.lineWidth=near?1.7:1;ctx.stroke();ctx.restore();
 if(!near){let x=targetPos.x+S*.37,y=targetPos.y+S*.58;ctx.strokeStyle='#e9ead299';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke()}
}
function animate(now){
 const dt=Math.min(2,(now-(lastTime||now))/16.67);lastTime=now;
 if(phase==='intro'&&!layoutBlocked){
  let t=(now-introStart)/1000,ease=v=>v*v*(3-2*v);
  introContact??=constrainTile(home,{x:targetPos.x+7,y:targetPos.y+6}).pos;
  if(t<.48){let k=ease(t/.48);tile=constrainTile(tile,{x:home.x+(introContact.x-home.x)*k,y:home.y+(introContact.y-home.y)*k}).pos}
  else if(t<1.15)tile=constrainTile(tile,{x:introContact.x+Math.sin((t-.48)*23)*3,y:introContact.y+Math.sin((t-.48)*17)*4}).pos;
  else if(t<1.75){let k=ease((t-1.15)/.6);tile=constrainTile(tile,{x:introContact.x+(home.x-introContact.x)*k,y:introContact.y+(home.y-introContact.y)*k}).pos}
  else finishIntro();
 }
 if(phase==='docking'){
  let k=Math.min(1,(now-animationStart)/300),e=1-(1-k)**3,q=fixedPosition(animationFrom);tile=worldPosition({x:Math.round(q.x*(1-e)),y:Math.round(q.y*(1-e))});
  if(k===1){phase='success';$('#success-detail').textContent=`정확도 ${Math.min(100,Math.round(fit*100))}% · 마지막 한 장, 완성.`;setTimeout(()=>{if(phase==='success'){$('#success').hidden=false;$('#next').focus()}},650)}
 }
 if(backdropDirty)paintBackdrop();ctx.clearRect(0,0,W,H);ctx.drawImage(backdrop,0,0,W,H);drawTargetGuide();drawTile();drawSnapGuides(now);drawRuler();drawTriangle();drawStroke();
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.06*dt;p.life-=.025*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*3);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);drawMagnifier();requestAnimationFrame(animate);
}
resize();ready=true;initLevel(0,true,requestedSeed());new ResizeObserver(()=>resize()).observe($('#playfield'));requestAnimationFrame(animate);
</script>
